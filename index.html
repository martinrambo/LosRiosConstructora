
<style>
/* ====== HEADER GENERAL ====== */
.main-header {
    background-color: #f5f5f5; /* gris claro elegante */
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    width: 100%;
    z-index: 1000;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.8rem 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* ====== LOGO ====== */
.logo img {
    height: 60px;
    width: auto;
}

/* ====== NAV LINKS ====== */
.nav-links {
    display: flex;
    gap: 2rem;
}

.nav-links a {
    text-decoration: none;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
    color: #333; /* gris oscuro sobrio */
    transition: color 0.3s ease;
}

.nav-links a:hover {
    color: #7a7a7a; /* gris medio elegante */
}

/* ====== MENU RESPONSIVO ====== */
.menu-toggle {
    display: none;
    font-size: 1.8rem;
    cursor: pointer;
}

/* ====== RESPONSIVE ====== */
@media (max-width: 768px) {
    .nav-links {
        position: absolute;
        top: 70px;
        right: 0;
        background: #f5f5f5;
        flex-direction: column;
        gap: 1rem;
        width: 200px;
        padding: 1rem;
        border-left: 1px solid #ddd;
        display: none;
    }

    .nav-links.active {
        display: flex;
    }

    .menu-toggle {
        display: block;
    }
}


/* ====== FOOTER ====== */
.main-footer {
    background-color: #f5f5f5;
    border-top: 1px solid #ddd;
    padding: 2rem 1rem;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.9rem;
    color: #333;
}

.footer-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 2rem;
}

.footer-logo img {
    height: 50px;
    margin-bottom: 0.5rem;
}

.footer-logo p {
    font-size: 0.85rem;
    color: #555;
}

.footer-links {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.footer-links a {
    text-decoration: none;
    color: #333;
    transition: color 0.3s ease;
}

.footer-links a:hover {
    color: #7a7a7a;
}

.footer-contact p {
    margin: 0.3rem 0;
    color: #555;
    font-size: 0.85rem;
}

/* ====== RESPONSIVE ====== */
@media (max-width: 768px) {
    .footer-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .footer-links {
        flex-direction: row;
        gap: 1rem;
    }
}

/* ====== Cotizador / Acordeón ====== */
.cotizador { 
  max-width: 1200px; margin: 2rem auto; padding: 0 1rem; 
  font-family: 'Helvetica Neue', Arial, sans-serif; color: #333;
}
.cotizador h2 { font-size: 1.4rem; margin-bottom: 1rem; }

.acc-item { 
  border: 1px solid #ddd; border-radius: 10px; background:#f7f7f7; 
}
.acc-item + .acc-item { margin-top: 1rem; }
.acc-item > summary {
  cursor: pointer; list-style: none; padding: 1rem 1.25rem; font-weight: 600;
}
.acc-item > summary::-webkit-details-marker { display: none; }
.acc-item[open] > summary { border-bottom: 1px solid #e5e5e5; }

.acc-grid { 
  display: grid; gap: 1.25rem; padding: 1.25rem; 
  grid-template-columns: 1fr 360px; 
}
@media (max-width: 900px){ .acc-grid{ grid-template-columns: 1fr; } }

/* ====== Form ====== */
.form-grid { display: grid; gap: 1rem; grid-template-columns: repeat(2, minmax(0,1fr)); }
@media (max-width: 600px){ .form-grid{ grid-template-columns: 1fr; } }
.field .label { display:block; font-size:.9rem; margin-bottom:.4rem; color:#555; }
select { width:100%; padding:.6rem .7rem; border:1px solid #d6d6d6; border-radius:10px; background:#fff; }

.options { display:flex; flex-wrap:wrap; gap:.5rem; }
.radio-chip {
  position: relative; display:inline-flex; align-items:center; gap:.5rem;
  padding:.55rem .8rem; border:1px solid #d6d6d6; border-radius:999px; background:#fff;
  cursor:pointer; transition: all .2s ease;
}
.radio-chip input { position:absolute; inset:0; opacity:0; cursor:pointer; }
.radio-chip.active, .radio-chip:hover { border-color:#999; background:#f0f0f0; }

/* ====== Preview ====== */
.preview { 
  border:1px solid #ddd; border-radius:12px; background:#fff; 
  display:flex; flex-direction:column; overflow:hidden;
}
.preview-img { background:#fafafa; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:center; min-height:180px; }
.preview-img img { max-width:100%; max-height:220px; object-fit:contain; }
.preview-info { padding:1rem; display:grid; gap:.35rem; }
.preview-info h3 { margin:0; font-size:1.05rem; }
.preview-info .precio { font-weight:700; font-size:1.1rem; }
.btn-add {
  margin-top:.4rem; padding:.6rem .9rem; border:none; border-radius:10px; cursor:pointer;
  background:#222; color:#fff; transition:opacity .2s ease;
}
.btn-add:hover { opacity:.9; }

/* Helpers paleta */
.badge { font-size:.8rem; color:#666; }

</style>

<header class="main-header">
    <div class="container">
        <a href="/" class="logo">
            <img src="img/LogoLosRios.jpg" alt="Los Ríos Constructora">
        </a>
        <nav class="nav-links">
            <a href="#">Inicio</a>
            <a href="#">Nosotros</a>
            <a href="#">Proyectos</a>
            <a href="#">Contacto</a>
        </nav>
        <div class="menu-toggle" id="menu-toggle">
            ☰
        </div>
    </div>
</header>

<section class="cotizador">
  <h2>Configura tu proyecto</h2>

  <!-- Ítem 1: Ventanas -->
  <details class="acc-item" open>
    <summary>Ventanas</summary>

    <div class="acc-grid">
      <form id="form-ventanas" class="form-grid" autocomplete="off">
        <!-- Tipo de sistema -->
        <div class="field">
          <label class="label">Tipo de ventana</label>
          <div class="options" id="opt-sistema">
            <!-- radios generados por JS -->
          </div>
        </div>

        <!-- Tipo de vidrio -->
        <div class="field">
          <label class="label">Tipo de vidrio</label>
          <select id="sel-vidrio">
            <option value="">Selecciona…</option>
            <option value="Monolítico">Monolítico</option>
            <option value="Termopanel">Termopanel (DVH)</option>
            <option value="Laminado">Laminado</option>
          </select>
        </div>

        <!-- Tamaño -->
        <div class="field">
          <label class="label">Medida</label>
          <select id="sel-medida">
            <option value="">Selecciona…</option>
            <option value="140x120">140×120 cm</option>
            <option value="120x100">120×100 cm</option>
            <option value="100x100">100×100 cm</option>
          </select>
        </div>

        <!-- Marca -->
        <div class="field">
          <label class="label">Marca</label>
          <select id="sel-marca">
            <option value="">Selecciona…</option>
            <option value="WINTEC">WINTEC</option>
            <option value="Altron">Altron</option>
            <option value="GENÉRICA">Genérica</option>
          </select>
        </div>
      </form>

      <!-- Preview -->
      <aside class="preview" id="preview-ventana">
        <div class="preview-img">
          <img id="preview-img" src="{% static 'app/img/VentanaEjemplo.jpg' %}" alt="Ventana seleccionada">
        </div>
        <div class="preview-info">
          <h3 id="preview-title">Selecciona una opción</h3>
          <p id="preview-desc">Aquí verás el detalle de la ventana elegida.</p>
          <p class="precio" id="preview-price">—</p>
          <button type="button" class="btn-add" id="btn-add-ventana">Agregar al pedido</button>
        </div>
      </aside>
    </div>
  </details>
</section>

<footer class="main-footer">
    <div class="footer-container">
        <div class="footer-logo">
            <img src="img/LogoLosRios.jpg" alt="Los Ríos Constructora">
            <p>Constructora Los Ríos © {{ year }}</p>
        </div>
        
        <div class="footer-links">
            <a href="#">Inicio</a>
            <a href="#">Nosotros</a>
            <a href="#">Proyectos</a>
            <a href="#">Contacto</a>
        </div>
        
        <div class="footer-contact">
            <p><strong>Teléfono:</strong> +56 9 1234 5678</p>
            <p><strong>Email:</strong> contacto@losrios.cl</p>
        </div>
    </div>
</footer>

<script>
    // Dataset DEMO (puedes reemplazarlo por JSON desde Django)
const WINDOWS = [
  {
    id: "wintec-140x120-mono",
    sistema: "Americana",
    marca: "WINTEC",
    vidrio: "Monolítico",
    medida: "140x120",
    precio: 109990,
    img: STATIC_URL("app/img/windows/wintec_140x120.jpg"),
    nombre: "Ventana PVC 140×120 cm monolítico blanco corredera"
  },
  {
    id: "generica-120x100-dvh",
    sistema: "Europea",
    marca: "GENÉRICA",
    vidrio: "Termopanel",
    medida: "120x100",
    precio: 154990,
    img: STATIC_URL("app/img/windows/generica_120x100.jpg"),
    nombre: "Ventana PVC 120×100 cm termopanel corredera"
  }
];

/* ===== Utilidad para construir rutas estáticas sin mezclar Django dentro del JS.
   Cambia BASE_STATIC si tu carpeta cambia, o si prefieres, genera el JSON desde Django con las URLs absolutas. */
const BASE_STATIC = document.querySelector("link[rel='stylesheet'][href*='/static/']")
  ? document.querySelector("link[rel='stylesheet'][href*='/static/']").href.split("/app/")[0] + "/"
  : "/static/";
function STATIC_URL(path){ return BASE_STATIC + path; }

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

// --- Render de opciones de "sistema" a partir de los datos
(function initVentanas(){
  const sistemas = [...new Set(WINDOWS.map(w => w.sistema))]; // ej: ["Americana", "Europea"]
  const cont = document.getElementById('opt-sistema');

  sistemas.forEach((s,i) => {
    const id = `sys-${i}`;
    const chip = document.createElement('label');
    chip.className = 'radio-chip';
    chip.innerHTML = `
      <input type="radio" name="sistema" value="${s}" ${i===0?'checked':''}>
      <span>${s}</span>
    `;
    cont.appendChild(chip);
  });

  // Estado inicial
  updatePreview();

  // Listeners
  cont.addEventListener('change', () => {
    // activar estilo
    $$('#opt-sistema .radio-chip').forEach(l => l.classList.remove('active'));
    const checked = $('#opt-sistema input:checked')?.closest('.radio-chip');
    checked && checked.classList.add('active');
    updatePreview();
  });
  $('#sel-vidrio').addEventListener('change', updatePreview);
  $('#sel-medida').addEventListener('change', updatePreview);
  $('#sel-marca').addEventListener('change', updatePreview);

  // Marcar activo visual del primero
  const firstChip = $('#opt-sistema .radio-chip');
  firstChip && firstChip.classList.add('active');

  // Agregar al pedido (demo)
  $('#btn-add-ventana').addEventListener('click', () => {
    const sel = pickCurrent();
    if(!sel){ alert('Completa las selecciones de ventana.'); return; }
    // Aquí puedes hacer POST via fetch a tu endpoint Django para agregar al carrito/cotización
    console.log('Agregar item:', sel);
    alert('Ventana agregada a la cotización.');
  });
})();

function pickCurrent(){
  const sistema = $('#opt-sistema input:checked')?.value || '';
  const vidrio  = $('#sel-vidrio').value || '';
  const medida  = $('#sel-medida').value || '';
  const marca   = $('#sel-marca').value || '';

  if(!sistema || !vidrio || !medida || !marca) return null;

  // Buscar coincidencia exacta en dataset (si no hay, arma un ítem estimado)
  let item = WINDOWS.find(w => 
    w.sistema===sistema && w.vidrio===vidrio && w.medida===medida && w.marca===marca
  );

  if(!item){
    // Item “estimado” (sin foto específica)
    item = {
      sistema, vidrio, medida, marca,
      precio: null,
      img: STATIC_URL("app/img/windows/placeholder_window.png"),
      nombre: `Ventana ${sistema} ${medida} ${vidrio}`
    };
  }
  return item;
}

function updatePreview(){
  const item = pickCurrent();
  const title = $('#preview-title');
  const desc  = $('#preview-desc');
  const price = $('#preview-price');
  const img   = $('#preview-img');

  if(!item){
    title.textContent = 'Selecciona una opción';
    desc.textContent  = 'Aquí verás el detalle de la ventana elegida.';
    price.textContent = '—';
    return;
  }

  title.textContent = `Ventana ${item.sistema} ${item.medida}`;
  desc.innerHTML    = `${item.nombre} <span class="badge">Marca: ${item.marca}</span> · <span class="badge">${item.vidrio}</span>`;
  price.textContent = (item.precio!=null) ? clp(item.precio) : 'Precio a confirmar';
  if(item.img) img.src = item.img;
}

function clp(n){ 
  return new Intl.NumberFormat('es-CL', { style:'currency', currency:'CLP', maximumFractionDigits:0 }).format(n);
}

</script>
